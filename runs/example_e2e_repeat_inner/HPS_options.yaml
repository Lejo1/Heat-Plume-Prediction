batchsize:
  values:
  - 20
kernel_size:
  values:
  - 5
depth:
  values:
  - 4
init_features:
  values:
  - 32
stride:
  values:
  - 1
dilation:
  values:
  - 1
activation_fct:
  values:
  - ReLU
norm:
  values:
  - batchnorm
repeat_inner:   # CNN1: second conv per block -> receptive field 361 cells (CNN2: false via unet_args_T)
  values:
  - True
skip_per_dir:   # stage-1 patch stride: 4096 patches/epoch at len_box 512
  values:
  - 32
len_box:        # stage-1 patch size: 256 is smaller than the 2*188-cell crop of the repeat_inner CNN1; 512 -> 136^2 output
  values:
  - 512
inputs:
  values:
    - pki
train_loss:
  values:
  - MSE
v_loss:
  values:
  # e2e stage 2, training loss only: loss L_v of the velocity term (MSE | MAE | Huber),
  # null = same as train_loss
  - MSE
bool_cutouts:
  values:
  - True
optimizer_switch:
  values:
  - False
lr:
  values:
  - 0.0001