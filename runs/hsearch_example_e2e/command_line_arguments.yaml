# Hyperparameter search over the e2e pipeline trained FROM SCRATCH (case: train):
#   cd code && python main.py --destination hsearch_example_e2e --hsearch True
# Both nets start new in every trial: CNN1 is pretrained in stage 1 (50 epochs on data-0 patches,
# lr 1e-4 as for baseline_v), CNN2 is randomly initialized. Searched (HPS_options.yaml): stage-2 /
# streamline parameters, the frame losses, and the architectures of CNN1 and CNN2 (separately, paper
# ranges). Every trial trains in hsearch_example_e2e/trials/<number>/. Objective: the best (lowest)
# val_loss of a trial. A trial takes ~35 min stage 1 + ~4.5 h stage 2 on the full domain (RTX 3090).
pipeline: e2e
case: train
data_prep:
data_raw: ../datasets/dataset_giant_100hp_varyK
destination:
device: cuda
subdomain: false       # full domain, comparable with the finetune runs

# --- study ------------------------------------------------------------------------------------
n_trials: 20
pruner_startup_trials: 3
pruner_warmup_epochs: 500  # = epochs: the MedianPruner never prunes (pruner off). With warmup 20 the first
                           # search pruned 10/20 trials, but the epoch-20 val loss of a randomly initialized
                           # CNN2 hardly predicts the final one (trial 0: worst at epoch 20, final 7.2e-4).
                           # Out-of-memory trials are still marked pruned.

# --- fixed pipeline setup ----------------------------------------------------------------------
model: null
model_v: null          # CNN1's architecture is searched, so no checkpoint can be loaded: stage 1 instead
stage1_epochs: 50      # stage 1 per trial: CNN1 pretrained on data-0 patches (skip_per_dir / len_box in HPS_options)
stage1_lr_schedule:    # stage 1 at the paper's step-1 lr, independent of the searched stage-2 lr
  0: 0.0001
epochs: 500            # stage 2 per trial (as example_e2e); every trial runs all epochs (pruner off)
inputs: pki
outputs: t
notes: hyperparameter search (e2e from scratch; stage-2 parameters, frame losses, architectures of CNN1 and CNN2)
randomK: true
t_steps: 10000
fade_mode: absolute
compile: true
stage1_force: false
val_loss: Huber
val_loss_with_v: false
order_data:
- 0
- 1
- 2

# --- lr comes from HPS_options.yaml -------------------------------------------------------------
lr_schedule:           # MUST stay empty, as must lr_stage2: both would override the searched lr
                       # (run_e2e refuses a search config that sets either)

# --- defaults for searched keys (used when HPS_options.yaml does not list them) ------------------
unet_args_T:           # CNN2's architecture where it differs from CNN1; depth_T / init_features_T /
  kernel_size: 4       # kernel_size_T from HPS_options.yaml overwrite these keys per trial
sigma: 1.0
v_blur: 0.0
v_blur_end: 0.0        # follows the drawn v_blur automatically while v_blur is searched
v_blur_anneal_epochs:
lambda_v: 0.01
clip_grad: 1.0
detach_direct_v: false
detach_trajectory: true
bn_reestimate: false
freeze_bn: none
lambda_N: 1.0          # streamline-frame losses (see WhatSoFar.md); lambda_N, lambda_TOF and seed_mode
lambda_TOF: 0.3        # are searched, the options below are fixed
seed_mode: random

# --- fixed streamline-frame options --------------------------------------------------------------
n_seeds: 200                 # random seeds (random / both)
seed_hp_offsets: false       # hp seeds: add the model's +-10-cell offset variants
resample_seeds_each_epoch: true  # training random seeds redrawn every epoch; val/test fixed by seed_rng
seed_rng: 0
frame_ds_cells: 0.5          # arc-length spacing of the true-line nodes [cells]
frame_eps: p5                # [m/y] or "pX" = X-th percentile of |v*| on the training datapoint (p5 = 45 m/y)
tof_floor:                   # [m/y] floor delta of the travel time, empty = frame_eps / 10
tof_checkpoint_cells: 50     # travel-time checkpoints every N cells of arc length (+ line end)
well_mask_mode: fixed        # fixed | flow: drop nodes within r_w of any heat pump
well_mask_radius: 5          # fixed: r_w [cells]
well_mask_c: 1.0             # flow: r_w = max(2, c * Q / (b * phi * |v*|)), Q, b, phi from the simulation
seed_max_length_cells:       # empty = trace to t_end
frame_loss_on_val: log       # log: the objective (val_loss) stays Huber(T) without the frame terms
log_frame_metrics: true      # per-epoch train/val L_N, L_TOF, angle

# --- diagnostics: same set of files as a normal run, written per trial -------------------------
# Each trial dir then holds what runs/finetune_e2e holds: measurements_test_start.yaml,
# val_e2e_start.png, test_e2e_start.png, grad_diag_stage2_start.png, pipeline_plots/ (PNGs +
# pipeline_scalars.csv), val_e2e.png, test_e2e.png, model.pt, measurements*.yaml, tfevents.
# A pruned trial keeps only the files written before its stage-2 run ended.
visualize: true          # start + final val/test panels and measurements_test_start.yaml
grad_diag: true          # grad_diag_stage2_start.png: CNN1's gradient split into the routes
grad_diag_only: false
pipeline_plot_every: 5   # every N optimizer steps, as in runs/finetune_e2e
pipeline_plot_max: 40
