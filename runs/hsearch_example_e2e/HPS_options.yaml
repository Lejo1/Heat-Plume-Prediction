# Search space of the from-scratch e2e search. Per key:
#   values: [...]              categorical
#   low/high (+ log:, step:)   range; int when both bounds are ints, else float
# The architectures of CNN1 and CNN2 are searched separately, with the ranges of the paper's search,
# except init_features <= 32 (64 does not fit a full-domain step on a 24 GB GPU).
# Depth and kernel size change the output size, so the val loss of trials covers areas of different size.

# --- stage-2 / streamline parameters (searched) ---------------------------------------------------
lr:
  low: 0.00001
  high: 0.001
  log: true
train_loss:
  values: [MSE, MAE, Huber]
v_loss:
  values: [MSE, MAE]
lambda_v:
  low: 0.0001
  high: 1.0
  log: true
v_blur:
  low: 0.0
  high: 4.0
sigma:               # from SIGMA_BLUR_MIN (1.5) on, the drawing takes the blur path
  low: 0.5
  high: 4.0
clip_grad:
  values: [1.0, 10.0, 100.0]
freeze_bn:           # only CNN1's: CNN2 starts randomly initialized
  values: [none, v]
detach_direct_v:
  values: [true, false]
detach_trajectory:
  values: [true, false]
bn_reestimate:
  values: [true, false]

# --- streamline-frame losses (searched; the other frame options are fixed in command_line_arguments) ---
lambda_N:
  low: 0.1
  high: 10.0
  log: true
lambda_TOF:
  low: 0.03
  high: 3.0
  log: true
seed_mode:
  values: [hp, random, both]

# --- CNN1 architecture (searched, paper step 1: depth 4, 32 features, kernel 5) -------------------
depth:
  values: [1, 2, 3, 4]
init_features:
  values: [8, 16, 32]
kernel_size:
  values: [3, 4, 5]

# --- CNN2 architecture (searched, written into unet_args_T; paper step 3: depth 4, 32, kernel 4) --
depth_T:
  values: [1, 2, 3, 4]
init_features_T:
  values: [8, 16, 32]
kernel_size_T:
  values: [3, 4, 5]

# --- fixed (shared by both nets; patch parameters only affect stage 1) ----------------------------
stride:
  values: [1]
dilation:
  values: [1]
activation_fct:
  values: [ReLU]
norm:
  values: [batchnorm]
repeat_inner:
  values: [False]
batchsize:
  values: [20]
skip_per_dir:
  values: [16]
len_box:
  values: [256]
inputs:
  values: [pki]
bool_cutouts:
  values: [True]
optimizer_switch:
  values: [False]
