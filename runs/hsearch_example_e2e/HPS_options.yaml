# Search space of the from-scratch e2e search. Forms per key:
#   values: [...]              categorical
#   low/high (+ log:, step:)   range; int when both bounds are ints, else float
# Both nets start new in every trial: CNN1 gets stage 1 (velocity pretraining on data-0 patches,
# see command_line_arguments.yaml), CNN2 is randomly initialized. Their architectures are searched
# separately, with the ranges of the paper's LGCNN random-k search (APPENDIX, tab:params), except
# init_features, which stops at 64: 128 does not fit a full-domain e2e step on a 24 GB card
# (out-of-memory trials are pruned by run_e2e).
# Depth and kernel size change the output area (valid convolutions), so trials compute the val loss
# on areas of different size - accepted, as in the paper's per-step search.

# --- stage-2 / streamline parameters (searched) ---------------------------------------------------
lr:
  low: 0.00001
  high: 0.001
  log: true
train_loss:
  values: [MSE, MAE, Huber]
v_loss:
  values: [MSE, MAE]
lambda_v:
  low: 0.0001
  high: 1.0
  log: true
v_blur:
  low: 0.0
  high: 4.0
sigma:               # must stay below SIGMA_BLUR_MIN (1.5), else the rasterizer takes the blur path
  low: 0.5
  high: 4.0
clip_grad:
  values: [1.0, 10.0, 100.0]
freeze_bn:           # only CNN1 is worth freezing here: CNN2's statistics start out random
  values: [none, v]
detach_direct_v:
  values: [true, false]
detach_trajectory:
  values: [true, false]
bn_reestimate:
  values: [true, false]

# --- streamline-frame losses (searched; the other frame options are fixed in command_line_arguments) ---
lambda_N:            # finetune controls 2026-10-14: 1 good, 10 lets the speed drift
  low: 0.1
  high: 10.0
  log: true
lambda_TOF:
  low: 0.03
  high: 3.0
  log: true
seed_mode:
  values: [hp, random, both]

# --- CNN1 architecture (searched, paper step 1: depth 4, 32 features, kernel 5) -------------------
depth:
  values: [1, 2, 3, 4]
init_features:
  values: [8, 16, 32, 64]
kernel_size:
  values: [3, 4, 5]

# --- CNN2 architecture (searched, written into unet_args_T; paper step 3: depth 4, 32, kernel 4) --
depth_T:
  values: [1, 2, 3, 4]
init_features_T:
  values: [8, 16, 32, 64]
kernel_size_T:
  values: [3, 4, 5]

# --- fixed (shared by both nets; patch parameters only affect stage 1) ----------------------------
stride:
  values: [1]
dilation:
  values: [1]
activation_fct:
  values: [ReLU]
norm:
  values: [batchnorm]
repeat_inner:
  values: [False]
batchsize:
  values: [20]
skip_per_dir:
  values: [16]
len_box:
  values: [256]
inputs:
  values: [pki]
bool_cutouts:
  values: [True]
optimizer_switch:
  values: [False]
