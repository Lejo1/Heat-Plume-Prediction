# Search space of the from-scratch e2e search. Forms per key:
#   values: [...]              categorical
#   low/high (+ log:, step:)   range; int when both bounds are ints, else float
# No architecture is searched: CNN1 must keep baseline_v's values (block at the end) or model_v no
# longer loads, and CNN2 is fixed to the paper's best step-3 architecture via unet_args_T in
# command_line_arguments.yaml. A fixed architecture also keeps CNN2's output - and with it the area
# the val loss is computed on - identical across trials, so trials stay comparable.

# --- stage-2 / streamline parameters (searched) ---------------------------------------------------
lr:
  low: 0.00001
  high: 0.001
  log: true
train_loss:
  values: [MSE, MAE, Huber]
v_loss:
  values: [MSE, MAE]
lambda_v:
  low: 0.0001
  high: 1.0
  log: true
v_blur:
  low: 0.0
  high: 4.0
sigma:               # must stay below SIGMA_BLUR_MIN (1.5), else the rasterizer takes the blur path
  low: 0.5
  high: 4.0
clip_grad:
  values: [1.0, 10.0, 100.0]
freeze_bn:           # only CNN1 is worth freezing here: CNN2's statistics start out random
  values: [none, v]
detach_direct_v:
  values: [true, false]
detach_trajectory:
  values: [true, false]
bn_reestimate:
  values: [true, false]

# --- CNN1 architecture: fixed to baseline_v (model_v), do NOT search ------------------------------
kernel_size:
  values: [5]
depth:
  values: [4]
init_features:
  values: [32]
stride:
  values: [1]
dilation:
  values: [1]
activation_fct:
  values: [ReLU]
norm:
  values: [batchnorm]
repeat_inner:
  values: [False]
batchsize:
  values: [20]
skip_per_dir:
  values: [16]
len_box:
  values: [256]
inputs:
  values: [pki]
bool_cutouts:
  values: [True]
optimizer_switch:
  values: [False]
