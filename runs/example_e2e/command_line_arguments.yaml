pipeline: e2e
case: train
data_prep:
data_raw: ../datasets/dataset_giant_100hp_varyK
destination:
device: cuda
epochs: 500        # stage 2 (joint full-pipeline training; 1 optimizer step per epoch and datapoint)
stage1_epochs: 50  # stage 1: pretrain CNN1 on velocities with the partitioned dataset (~1000 patch-batches/epoch; matches baseline_v's 50 epochs); 0 = skip
inputs: pki
model: null
notes: end-to-end LGCNN (CNN1 + differentiable streamlines + CNN2), pure T loss, from scratch
outputs: t
visualize: true
randomK: true    # True for varyK datasets (flow main-direction switched)
t_steps: 10000   # streamline samples; also caps the RK4 steps
sigma: 1.0       # soft-drawing splat width in cells
fade_mode: absolute  # streamline fading 1 - t/t_end (cut-invariant; "per_line" = legacy paper convention)
clip_grad: 1.0   # cap on the gradient norm (exploding gradients through the streamlines)
lambda_v: 0.5    # weight of the auxiliary velocity loss: MSE(T) + lambda_v * MSE(v); 0/missing = pure T loss
compile: true    # torch.compile the RK4 step (removes per-step CPU dispatch overhead); falls back to eager on failure
order_data:
- 0
- 1
- 2
