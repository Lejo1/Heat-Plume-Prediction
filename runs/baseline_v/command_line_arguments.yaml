activation_fct: ReLU
batchsize: 20
bool_cutouts: true
case: train
data_prep: ../../datasets_prep/dataset_giant_100hp_varyK inputs_pki outputs_xy
data_raw: ../datasets/dataset_giant_100hp_varyK
depth: 4
destination: ../runs/baseline_v
device: cuda
dilation: 1
epochs: 300  # Julia's BEST_predict_v_v4 decays the lr at epoch 120 and 260 (learning_rate_history.csv), so the run has to reach past 260 for the schedule to apply at all
init_features: 32
inputs: pki
kernel_size: 5
len_box: 256
lr: 0.0001
model: null
norm: batchnorm
notes: baseline step 1 (predict v), synthetic-permeability (varyK) dataset, DaRUS
  doi:10.18419/DARUS-4156
optimizer_switch: false
order_data:
- 0
- 1
- 2
outputs: xy
repeat_inner: false
skip_per_dir: 16
stride: 1
subdomain: false   # true = train/val/test on one hardcoded 736^2 window instead of the full 2560^2
                   # field, for debugging. See preprocessing/subdomain.py.
train_loss: MSE
visualize: false
