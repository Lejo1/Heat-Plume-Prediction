pipeline: e2e
case: train
data_prep:
data_raw: ../datasets/dataset_giant_100hp_varyK
destination:
device: cuda
subdomain: false   # true = train/val/test on one hardcoded 736^2 window instead of the full 2560^2
                   # field (12x cheaper, for debugging). See preprocessing/subdomain.py.
                   # Losses and metrics of a windowed run are not comparable to full-domain ones.
epochs: 500       # stage 2 (joint full-pipeline training; 1 optimizer step per epoch and datapoint);
                  # full domain ~31 s/epoch on an RTX 3090, i.e. ~4.5 h
# model_v: seed CNN1 from an existing step-1 run instead of running stage 1 here (null = off).
# Pins step 1 across experiments, which matters: the paper reports +-20% run-to-run spread on the
# step-1 test MAE, so an unpinned CNN1 makes e2e runs incomparable to each other.
#   ../../models/BEST_predict_v_v4   Pelzer's step-1 model
#   ../runs/baseline_v               our own step-1 run
model_v: ../../models/BEST_predict_v_v4
stage1_epochs: 50  # stage 1: pretrain CNN1 on velocities with the partitioned dataset (~1000 patch-batches/epoch; matches baseline_v's 50 epochs); 0 = skip
lr_stage2: 0.0001
lr_schedule:         # stage-2 lr by epoch (merged onto epoch 0); see also lr_stage2 / lr_decay
  0: 0.0001          # 1e-4 for the first 5 epochs - deliberately 10x the tuned rate, to push the
  100: 0.00001
inputs: pki
model: null
notes: from scratch (CNN1 seeded from BEST_V, CNN2 random) with the frame losses, full domain - does joint training leave the two-stage optimum of the finetune runs?
outputs: t
visualize: true
randomK: true    # True for varyK datasets (flow main-direction switched)
t_steps: 10000   # streamline samples; also caps the RK4 steps
sigma: 1.0        # soft-drawing splat width in cells
v_blur: 0.0            # Gaussian smoothing of the velocity field the tracer reads, in cells (0 = off)
v_blur_end: 0.0           # anneal target (null = constant v_blur)
v_blur_anneal_epochs:  # epochs to anneal over (null = all `epochs`)
fade_mode: absolute  # streamline fading 1 - t/t_end (cut-invariant; "per_line" = legacy paper convention)
clip_grad: 1.0   # cap on the gradient norm (exploding gradients through the streamlines)
lambda_v: 0.01     # small velocity term (same loss type as T) anchors CNN1 near baseline_v instead of letting the T loss drift it away; 0 = pure T loss

# --- streamline-frame losses (FrameLoss, see WhatSoFar.md) ------------------------------------
# Same setting as finetune_e2e (controls 2026-10-14): keep CNN1's line directions and speeds while
# the T loss trains CNN2 from scratch at lr 1e-4.
lambda_N: 1.0                # 0 = off
lambda_TOF: 0.3              # 0 = off
seed_mode: random            # hp | random | both
n_seeds: 200                 # random seeds (random / both)
seed_hp_offsets: false       # hp seeds: add the model's +-10-cell offset variants
resample_seeds_each_epoch: true  # training random seeds redrawn every epoch; val/test fixed by seed_rng
seed_rng: 0
frame_ds_cells: 0.5          # arc-length spacing of the true-line nodes [cells]
frame_eps: p5                # [m/y] or "pX" = X-th percentile of |v*| on the training datapoint (p5 = 45 m/y)
tof_floor:                   # [m/y] floor delta of the travel time, empty = frame_eps / 10
tof_checkpoint_cells: 50     # travel-time checkpoints every N cells of arc length (+ line end)
well_mask_mode: fixed        # fixed | flow: drop nodes within r_w of any heat pump
well_mask_radius: 5          # fixed: r_w [cells]
well_mask_c: 1.0             # flow: r_w = max(2, c * Q / (b * phi * |v*|)), Q, b, phi from the simulation
seed_max_length_cells:       # empty = trace to t_end
frame_loss_on_val: log       # log: val loss without the frame terms (logged only) | include
log_frame_metrics: true      # per-epoch train/val L_N, L_TOF, angle (also on when a lambda > 0)
val_loss: Huber    # validation loss, also selects the best epoch: MSE | MAE | Huber (delta 1.0), in the
                   # same E2ELoss form as train_loss (HPS_options). Unset = same as the training loss.
val_loss_with_v: false  # true = Huber(T) + lambda_v * Huber(v), false = Huber(T) only
compile: true    # torch.compile the RK4 step (removes per-step CPU dispatch overhead); falls back to eager on failure
detach_direct_v: true  # stop-gradient on CNN2's direct vx/vy channels -> CNN1's T-loss signal flows only through the streamlines
detach_trajectory: true  # truncate the streamline gradient: each RK4 step blames only the velocity it sampled, no chain back along the line
stage1_force: false    # true = retrain stage 1 even if a cached unet_v_pretrained.pt exists
bn_reestimate: false   # after stage 1, recompute BatchNorm running stats on full-domain inputs (stage 1 trains CNN1 on 256^2 patches, stage 2 is full-domain); weights unchanged
freeze_bn: none       # none | v | T | both: keep the BatchNorm layers of CNN1 (v) / CNN2 (T) in eval mode during stage 2,
                      # so their running stats stay fixed (at the bn_reestimate values if that is on); gamma/beta still train
grad_diag: true       # after stage 1, decompose CNN1's gradient into streamline vs direct routes + save a plot
grad_diag_only: false  # stop right after the diagnostic (get the plot without running all stage-2 epochs)
pipeline_plot_every: 25  # stage 2: every N optimizer steps save each stage's (CNN1/streamlines/CNN2) in- and output plus the loss gradients before/after it -> destination/pipeline_plots/; 0 = off
pipeline_plot_max: 40    # cap on the number of such plots per run (0 = unlimited)
order_data:
- 0
- 1
- 2
